server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name palomaglade.com www.palomaglade.com _;

    root /var/www/html;
    index index.html;

    # Main site
    location / {
        try_files $uri $uri/ =404;
    }

    # Proxy WebSocket connections to Snapcast
    location /jsonrpc {
        proxy_pass http://127.0.0.1:1780/jsonrpc;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # Proxy stream WebSocket to Snapcast
    location /stream {
        proxy_pass http://127.0.0.1:1780/stream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
        proxy_buffering off;
        proxy_cache off;
    }

    # Snapweb assets (if using built-in web client)
    location /snapweb/ {
        proxy_pass http://127.0.0.1:1780/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
