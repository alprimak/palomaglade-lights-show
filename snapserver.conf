# Snapserver configuration for Palomaglade Christmas Lights Show

[http]
# Enable HTTP server for web-based clients
enabled = true
bind_to_address = 0.0.0.0
port = 1780
doc_root = /usr/share/snapserver/snapweb

[tcp]
# TCP stream for native clients
enabled = true
bind_to_address = 0.0.0.0
port = 1704

[stream]
# Audio source - TCP pipe receiving FFmpeg stream from Windows PC
# The Windows PC sends audio via: ffmpeg ... -f wav tcp://YOUR_IP:4953
source = tcp://0.0.0.0:4953?name=Christmas%20Music&mode=server&sampleformat=48000:16:2

# Buffer size in milliseconds - balance between latency and quality
buffer = 400

# Codec - flac for good quality with reasonable latency
codec = flac

# Backup silence stream (plays when no audio is received)
#source = pipe:///tmp/snapfifo?name=default

[logging]
# Log level: trace, debug, info, notice, warning, error, fatal
filter = *:info

[server]
# Number of audio threads
threads = -1
# Data directory for persistent data
datadir = /var/lib/snapserver
