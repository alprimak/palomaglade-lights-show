# Systemd service override for snapserver
# Install with: sudo cp snapserver-override.conf /etc/systemd/system/snapserver.service.d/override.conf
# Then run: sudo systemctl daemon-reload && sudo systemctl restart snapserver

[Service]
# Reduce shutdown timeout from 90s to 10s
TimeoutStopSec=10

# Kill main process and all children on stop
KillMode=mixed

# Restart more aggressively
Restart=always
RestartSec=5

# Allow port reuse faster
ExecStartPre=/bin/sleep 1
